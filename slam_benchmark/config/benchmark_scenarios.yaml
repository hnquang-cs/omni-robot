scenarios:
  corridor_static:
    description: "Simple corridor-like pass: slow forward motion with small yaw sweeps to test hallway map consistency."
    world_name: "$(find robot_description)/worlds/test_arena.world"
    world_launch: "robot_description gazebo_sim.launch"
    duration_sec: 95
    drive_pattern: "corridor"
    repetitions: 3
    expected_topics:
      - /scan
      - /odom
      - /tf
      - /tf_static
      - /clock
      - /cmd_vel
      - /gazebo/model_states
  open_room_obstacles:
    description: "Open-room obstacle mapping using a slow rectangular holonomic loop."
    world_name: "$(find robot_description)/worlds/test_arena.world"
    world_launch: "robot_description gazebo_sim.launch"
    duration_sec: 130
    drive_pattern: "rectangle"
    repetitions: 3
    expected_topics:
      - /scan
      - /odom
      - /tf
      - /tf_static
      - /clock
      - /cmd_vel
      - /gazebo/model_states
  narrow_turn:
    description: "Narrow-turn stress case: short forward segments with slow in-place turns for limited scan FOV stability."
    world_name: "$(find robot_description)/worlds/test_arena.world"
    world_launch: "robot_description gazebo_sim.launch"
    duration_sec: 110
    drive_pattern: "narrow_turn"
    repetitions: 3
    expected_topics:
      - /scan
      - /odom
      - /tf
      - /tf_static
      - /clock
      - /cmd_vel
      - /gazebo/model_states
  wide_obstacles:
    description: "Wide Gazebo world with 6-7 static box obstacles and wider mapping area."
    world_name: "$(find robot_description)/worlds/test_arena_wide_obstacles.world"
    world_launch: "robot_description gazebo_lidar_wide_obstacles.launch"
    slam_launch: "slam_benchmark slam_lidar_wide_obstacles_full.launch"
    duration_sec: 150
    drive_pattern: "wide_obstacles_safe"
    repetitions: 3
    expected_topics:
      - /lidar/scan
      - /odom
      - /map
      - /gazebo/model_states

notes:
  world_limitation: "Stage 8 scenarios reuse test_arena.world; Stage 9 wide_obstacles uses a dedicated wider Gazebo world with static box obstacles."
