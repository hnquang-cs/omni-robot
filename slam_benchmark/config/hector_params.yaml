# Stage 7 Hector mapping profile for comparison with Gmapping.
map_resolution: 0.05
map_size: 1024
map_start_x: 0.5
map_start_y: 0.5
map_multi_res_levels: 3
update_factor_free: 0.4
update_factor_occupied: 0.9
map_update_distance_thresh: 0.15
map_update_angle_thresh: 0.10
laser_z_min_value: -0.2
laser_z_max_value: 0.6
pub_map_odom_transform: true
output_timing: false
scan_subscriber_queue_size: 5
pub_map_scanmatch_transform: true
tf_map_scanmatch_transform_frame_name: scanmatcher_frame
use_tf_scan_transformation: true
use_tf_pose_start_estimate: false
