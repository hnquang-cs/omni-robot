TebLocalPlannerROS:
  odom_topic: /odom
  map_frame: odom

  teb_autosize: true
  dt_ref: 0.3
  dt_hysteresis: 0.1
  min_samples: 3
  max_samples: 500
  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: false
  max_global_plan_lookahead_dist: 2.0
  global_plan_viapoint_sep: 0.4
  via_points_ordered: false
  feasibility_check_no_poses: 5

  # Forward-only: planner should not request reverse or lateral motion.
  max_vel_x: 0.6
  # TEB warns when exact zero reverse speed is below penalty_epsilon.
  # The command filter still clamps any reverse or lateral command to zero.
  max_vel_x_backwards: 0.001
  max_vel_y: 0.001
  max_vel_theta: 0.9

  acc_lim_x: 0.6
  acc_lim_y: 0.001
  acc_lim_theta: 1.00

  min_turning_radius: 0.0
  wheelbase: 0.0
  cmd_angle_instead_rotvel: false

  xy_goal_tolerance: 0.20
  yaw_goal_tolerance: 0.35
  free_goal_vel: false
  complete_global_plan: true

  min_obstacle_dist: 0.18
  inflation_dist: 0.25
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 0.8
  obstacle_poses_affected: 15

  no_inner_iterations: 4
  no_outer_iterations: 3
  optimization_activate: true
  optimization_verbose: false
  penalty_epsilon: 0.0005

  weight_max_vel_x: 2.0
  weight_max_vel_y: 100.0
  weight_max_vel_theta: 4.0
  weight_acc_lim_x: 2.0
  weight_acc_lim_y: 100.0
  weight_acc_lim_theta: 5.0

  weight_kinematics_nh: 1000.0
  weight_kinematics_forward_drive: 1000.0
  weight_kinematics_turning_radius: 1.0

  weight_optimaltime: 0.5
  weight_shortest_path: 1.0
  weight_obstacle: 30.0
  weight_inflation: 0.1

  enable_homotopy_class_planning: false

  footprint_model:
    type: "polygon"
    vertices: [[0.18, 0.14], [0.18, -0.14], [-0.18, -0.14], [-0.18, 0.14]]
