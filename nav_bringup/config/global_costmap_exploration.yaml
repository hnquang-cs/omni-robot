# Stage 11 frontier exploration global costmap.
# - Subscribes to the LIVE Gmapping /map (not a static map_server map).
# - track_unknown_space true so frontiers can be reasoned about.
# - obstacle/inflation layers re-clear cells that Gmapping has confirmed free.
global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  update_frequency: 2.0
  publish_frequency: 1.0
  static_map: true        # required so the StaticLayer pulls from /map
  rolling_window: false
  resolution: 0.05
  transform_tolerance: 0.5
  footprint: [[0.18, 0.14], [0.18, -0.14], [-0.18, -0.14], [-0.18, 0.14]]
  plugins:
    - {name: static_layer,    type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  static_layer:
    map_topic: /map
    subscribe_to_updates: true
    track_unknown_space: true
    unknown_cost_value: 255
    trinary_costmap: true
  obstacle_layer:
    track_unknown_space: true
    observation_sources: lidar
    lidar:
      data_type: LaserScan
      topic: /lidar/scan
      sensor_frame: lidar_link
      marking: true
      clearing: true
      raytrace_range: 6.0
      obstacle_range: 4.0
  inflation_layer:
    inflation_radius: 0.15
    cost_scaling_factor: 6.0
