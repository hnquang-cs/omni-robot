TebLocalPlannerROS:
  odom_topic: /odom
  map_frame: map

  # Omni base velocity limits for the kinematic Gazebo controller.
  max_vel_x: 0.25
  max_vel_x_backwards: 0.12
  max_vel_y: 0.20
  max_vel_theta: 0.35
  acc_lim_x: 0.35
  acc_lim_y: 0.35
  acc_lim_theta: 0.45
  min_turning_radius: 0.0
  wheelbase: 0.0
  cmd_angle_instead_rotvel: false

  footprint_model:
    type: polygon
    vertices: [[0.26, 0.20], [0.26, -0.20], [-0.26, -0.20], [-0.26, 0.20]]

  xy_goal_tolerance: 0.25
  yaw_goal_tolerance: 0.35
  free_goal_vel: false

  teb_autosize: true
  dt_ref: 0.30
  dt_hysteresis: 0.10
  min_samples: 3
  max_samples: 500
  global_plan_overwrite_orientation: false
  allow_init_with_backwards_motion: true
  max_global_plan_lookahead_dist: 3.0
  global_plan_viapoint_sep: -1.0
  exact_arc_length: false

  min_obstacle_dist: 0.20
  inflation_dist: 0.30
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0
  obstacle_poses_affected: 15
  dynamic_obstacle_inflation_dist: 0.40
  include_dynamic_obstacles: false

  no_inner_iterations: 5
  no_outer_iterations: 4
  optimization_activate: true
  optimization_verbose: false
  penalty_epsilon: 0.10
  weight_max_vel_x: 2.0
  weight_max_vel_y: 2.0
  weight_max_vel_theta: 3.0
  weight_acc_lim_x: 1.0
  weight_acc_lim_y: 1.0
  weight_acc_lim_theta: 4.0
  weight_kinematics_nh: 1.0
  weight_kinematics_forward_drive: 0.0
  weight_kinematics_turning_radius: 0.0
  weight_optimaltime: 1.0
  weight_obstacle: 35.0
  weight_inflation: 0.1
  weight_viapoint: 1.0

  enable_homotopy_class_planning: false
  roadmap_graph_no_samples: 15
  max_number_classes: 2
