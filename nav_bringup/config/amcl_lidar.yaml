# AMCL localization for the Stage 10 simulated 2D LiDAR baseline.
odom_frame_id: odom
base_frame_id: base_footprint
global_frame_id: map
tf_broadcast: true
transform_tolerance: 0.5

min_particles: 500
max_particles: 2000
kld_err: 0.02
kld_z: 0.99
update_min_d: 0.05
update_min_a: 0.05
resample_interval: 1

laser_min_range: 0.15
laser_max_range: 8.0
laser_max_beams: 120
laser_z_hit: 0.95
laser_z_short: 0.05
laser_z_max: 0.05
laser_z_rand: 0.05
laser_sigma_hit: 0.2
laser_lambda_short: 0.1
laser_likelihood_max_dist: 2.0
laser_model_type: likelihood_field

# AMCL in ROS1 Noetic accepts omni; use diff only as a documented fallback if a local build rejects omni.
odom_model_type: omni
odom_alpha1: 0.05
odom_alpha2: 0.05
odom_alpha3: 0.05
odom_alpha4: 0.05
odom_alpha5: 0.05

initial_pose_x: 0.0
initial_pose_y: 0.0
initial_pose_a: 0.0
initial_cov_xx: 0.25
initial_cov_yy: 0.25
initial_cov_aa: 0.10
gui_publish_rate: 5.0
save_pose_rate: 0.5
