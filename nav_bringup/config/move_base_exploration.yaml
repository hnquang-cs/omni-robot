# Stage 11 move_base settings tuned for frontier exploration.
# Differences vs move_base_lidar.yaml:
#   - allow_unknown true on the global planner (frontier goals sit at
#     known/unknown boundaries; rejecting unknown rejects every goal).
#   - oscillation tolerances slightly relaxed because explore_lite re-issues
#     goals as the map grows.
base_global_planner: global_planner/GlobalPlanner
base_local_planner: teb_local_planner/TebLocalPlannerROS

controller_frequency: 10.0
planner_frequency: 1.0
planner_patience: 5.0
controller_patience: 10.0
conservative_reset_dist: 1.0

recovery_behavior_enabled: true
clearing_rotation_allowed: false
shutdown_costmaps: false
oscillation_timeout: 15.0
oscillation_distance: 0.20

GlobalPlanner:
  allow_unknown: true
  use_dijkstra: true
  use_quadratic: true
  use_grid_path: false
  old_navfn_behavior: false
  default_tolerance: 0.20
  visualize_potential: false
  publish_potential: true
  outline_map: false
  cost_factor: 0.55
  neutral_cost: 66
  lethal_cost: 253
